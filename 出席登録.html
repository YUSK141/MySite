<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>千葉工大 出席リンク（タイマー・自動判定版）</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 16px; /* 少し丸みを強くして可愛く */
            box-shadow: 0 8px 24px rgba(149, 157, 165, 0.2);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        h2 {
            font-size: 1.1rem;
            color: #5a6a85;
            margin-top: 0;
            font-weight: bold;
        }

        /* 🕰️ 時計セクションのスタイル */
        .clock-box {
            background-color: #2d3748;
            color: #fff;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 25px;
            font-family: 'Courier New', Courier, monospace;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }
        .clock-date {
            font-size: 0.9rem;
            letter-spacing: 0.1rem;
            margin-bottom: 5px;
            color: #cbd5e0;
        }
        .clock-time {
            font-size: 1.9rem;
            font-weight: bold;
            letter-spacing: 0.15rem;
            color: #63b3ed; /* 少し爽やかな青色に */
        }

        /* 🟢 出席ボタンがあるときのボックス */
        .active-class-box {
            background-color: #e6f4ea;
            border: 2px solid #34a853;
            padding: 18px;
            border-radius: 12px;
            margin-bottom: 25px;
            animation: pulse 2s infinite; /* 登録期間中は少しアニメーションさせる */
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(52, 168, 83, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(52, 168, 83, 0); }
            100% { box-shadow: 0 0 0 0 rgba(52, 168, 83, 0); }
        }

        .class-btn {
            background-color: #34a853;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
            box-shadow: 0 4px 6px rgba(52, 168, 83, 0.2);
            transition: all 0.2s;
        }
        .class-btn:hover {
            background-color: #2b8a44;
            transform: translateY(-1px);
        }

        /* 🌸 【新機能】授業がないときの可愛いボックス */
        .no-class-box {
            background-color: #fff5f5; /* 優しいピンク背景 */
            border: 2px dashed #feb2b2; /* 点線 */
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
        }
        .no-class-text {
            color: #e53e3e;
            font-size: 1rem;
            font-weight: bold;
            margin: 0 0 8px 0;
        }
        .no-class-subtext {
            color: #718096;
            font-size: 0.85rem;
            margin: 0;
        }

        hr {
            border: 0;
            border-top: 1px dashed #cbd5e0;
            margin: 25px 0;
        }
        .manual-section {
            color: #4a5568;
        }
        input[type="text"] {
            width: 80%;
            padding: 12px;
            font-size: 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            margin-bottom: 15px;
            outline: none;
            text-align: center;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            border-color: #3182ce;
        }
        .manual-btn {
            background-color: #3182ce;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 85%;
            box-shadow: 0 4px 6px rgba(49, 130, 206, 0.2);
        }
    </style>
</head>
<body>

<div class="container">
    
    <div class="clock-box">
        <div class="clock-date" id="clock-date"></div>
        <div class="clock-time" id="clock-time"></div>
    </div>

    <div id="auto-section">
        <h2>📅 今日の出席対象の授業</h2>
        <div id="attendance-area"></div>
    </div>

    <hr>

    <div class="manual-section">
        <h3>教室番号で直接移動</h3>
        <input type="text" id="classroom-number" placeholder="講義室番号（例: 1234）">
        <br>
        <button class="manual-btn" onclick="redirectToManual()">移動する</button>
    </div>
</div>

<script>
    const myTimetable = [
        { day: 1, name: "情報メディア基礎 高度2年", room: "5103", start: "10:00", end: "12:00" },
        { day: 1, name: "NWプログラミング基礎演習 高度2年", room: "3212", start: "13:00", end: "17:00" },
        { day: 1, name: "幾何学1", room: "5107", start: "17:00", end: "19:00" },
        { day: 2, name: "TCP/IP概論 高度2年", room: "8102", start: "09:00", end: "11:00" },
        { day: 2, name: "英語理解3eクラス", room: "5106", start: "11:00", end: "13:00" },
        { day: 2, name: "微分方程式 高度2年_偶数", room: "8206", start: "14:00", end: "16:00" },
        { day: 2, name: "離散数学 高度2年", room: "8206", start: "16:00", end: "18:00" },
        { day: 3, name: "データ構造とアルゴリズム 高度2年", room: "3212", start: "10:00", end: "12:00" },
        { day: 3, name: "確率統計 高度2年_偶数", room: "8109", start: "13:00", end: "15:00" },
        { day: 3, name: "数理モデリング 高度2年", room: "8201", start: "15:00", end: "17:00" },
        { day: 3, name: "解析学1", room: "5107", start: "17:00", end: "19:00" },
        { day: 4, name: "情報数学1 高度2年", room: "7202", start: "11:00", end: "13:00" },
        { day: 5, name: "キャリアデザイン2 高度", room: "1121", start: "10:00", end: "12:00" },
        { day: 5, name: "英語表現3eクラス", room: "5105", start: "13:00", end: "15:00" },
        { day: 5, name: "心理学", room: "5201", start: "15:00", end: "17:00" },
        { day: 6, name: "数学科教育法1", room: "612", start: "11:00", end: "13:00" },
        { day: 6, name: "教育課程論", room: "614", start: "14:00", end: "16:00" }
    ];

    const baseUrl = "https://attendance.is.it-chiba.ac.jp/attendance/class_room/";
    const weekdays = ["日", "月", "火", "水", "木", "金", "土"];

    window.onload = function() {
        startClock();
        checkCurrentClass();
        setInterval(checkCurrentClass, 60000); // 1分ごとにチェック
    };

    function startClock() {
        function updateClock() {
            const now = new Date();
            const dateStr = `${now.getFullYear()}.${now.getMonth() + 1}.${now.getDate()} (${weekdays[now.getDay()]})`;
            const timeStr = [now.getHours(), now.getMinutes(), now.getSeconds()]
                .map(unit => String(unit).padStart(2, '0'))
                .join(':');

            document.getElementById('clock-date').innerText = dateStr;
            document.getElementById('clock-time').innerText = timeStr;
        }
        updateClock();
        setInterval(updateClock, 1000);
    }

    function checkCurrentClass() {
        const now = new Date();
        const currentDay = now.getDay();
        const currentMinutes = now.getHours() * 60 + now.getMinutes();
        const area = document.getElementById('attendance-area');
        area.innerHTML = "";

        let foundClass = false;

        myTimetable.forEach(course => {
            if (course.day === currentDay) {
                const [startH, startM] = course.start.split(':').map(Number);
                const startMinutes = startH * 60 + startM;
                
                // 🌟 新ルール：授業開始の「30分前」から「60分後（1時間後）」まで表示
                const displayStart = startMinutes - 30;
                const displayEnd = startMinutes + 60;

                if (currentMinutes >= displayStart && currentMinutes <= displayEnd) {
                    foundClass = true;
                    
                    const box = document.createElement('div');
                    box.className = 'active-class-box';
                    box.innerHTML = `
                        <p style="margin:0 0 10px 0; color:#276749;">✨ <strong>${course.name}</strong> ✨<br>📍 講義室: ${course.room}</p>
                        <button class="class-btn" onclick="location.href='${baseUrl + course.room}'">
                            出席登録画面をひらく
                        </button>
                    `;
                    area.appendChild(box);
                }
            }
        });

        // 🌸 授業がないときの癒やし系メッセージ
        if (!foundClass) {
            const cuteBox = document.createElement('div');
            cuteBox.className = 'no-class-box';
            cuteBox.innerHTML = `
                <p class="no-class-text">⸜(* ॑꒳ ॑* )⸝ 今はお休み時間だよ</p>
                <p class="no-class-subtext">受付中の授業はありません。<br>次の授業までゆっくりしてね ☕️</p>
            `;
            area.appendChild(cuteBox);
        }
    }

    function redirectToManual() {
        const roomNumber = document.getElementById('classroom-number').value.trim();
        if (roomNumber === "") {
            alert("講義室番号を入力してください。");
            return;
        }
        window.location.href = baseUrl + roomNumber;
    }

    document.getElementById('classroom-number').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            redirectToManual();
        }
    });
</script>

</body>
</html>
